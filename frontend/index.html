<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Control LED - Sistema Arduino + Web</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet" />
</head>

<body class="bg-light">
<div class="container py-5">
<h1 class="mb-4">Control de LED - Sistema Arduino ESP + Web</h1>
<div class="card p-4 shadow-sm bg-white">
<h4>Estado del LED: <span id="led-status" class="fw-bold">Desconocido</span></h4>
<div class="mt-3">
<button id="btn-encender" class="btn btn-success me-2" disabled>Encender</button>
<button id="btn-apagar" class="btn btn-danger" disabled>Apagar</button>
</div>
</div>
</div>

<script>
//const wsUrl = 'ws://localhost:8080'; // Cambia según tu entorno
//const wsUrl = 'wss://TU-URL-REAL.onrender.com';
const wsUrl = 'wss://sistema-websocket.onrender.com';


let ws;

const ledStatusEl = document.getElementById('led-status');
const btnEncender = document.getElementById('btn-encender');
const btnApagar = document.getElementById('btn-apagar');

function conectarWebSocket() {
ws = new WebSocket(wsUrl);

ws.onopen = () => {
console.log('Conectado al WebSocket');
// botones se habilitan sólo cuando se recibe estado
};

ws.onmessage = (event) => {

const data = JSON.parse(event.data);
if (data.type === 'status') {
actualizarEstadoLed(data.led);
}
};

ws.onclose = () => {
console.log('Conexión WebSocket cerrada');
ledStatusEl.textContent = 'Desconectado';
deshabilitarBotones();
// Intentar reconectar después de 5 segundos
setTimeout(conectarWebSocket, 5000);
};

ws.onerror = (error) => {
console.error('Error WebSocket:', error);
};
}

function actualizarEstadoLed(estado) {
ledStatusEl.textContent = estado;
if (estado === 'ON') {
btnEncender.disabled = true;
btnApagar.disabled = false;
} else if (estado === 'OFF') {
btnEncender.disabled = false;
btnApagar.disabled = true;
} else {
deshabilitarBotones();

}
}

function deshabilitarBotones() {
btnEncender.disabled = true;
btnApagar.disabled = true;
}

btnEncender.addEventListener('click', () => {
if (ws && ws.readyState === WebSocket.OPEN) {
ws.send(JSON.stringify({ command: 'toggle' }));
}
});

btnApagar.addEventListener('click', () => {
if (ws && ws.readyState === WebSocket.OPEN) {
ws.send(JSON.stringify({ command: 'toggle' }));
}
});

// Iniciar conexión al cargar página
conectarWebSocket();
</script>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
