<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>
Control de 2 LEDs - ESP32
</title>


<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


<style>

body {
    background: #f4f6f9;
}

.card {
    border: none;
    border-radius: 15px;
}

.led-indicator {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 15px auto;
    background: #343a40;
    transition: all .3s ease;
}

.led-on {
    background: #00ff3c;

    box-shadow:
        0 0 10px #00ff3c,
        0 0 25px #00ff3c,
        0 0 50px #00ff3c;
}

.led-off {
    background: #343a40;
    box-shadow: none;
}

</style>

</head>


<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-md-8">


<div class="card p-4 shadow">

<h1 class="text-center mb-4">
Control de LEDs ESP32
</h1>


<!-- ============================================= -->
<!-- LED 1 -->
<!-- ============================================= -->

<div class="card bg-light p-3 mb-3">

<h4 class="text-center">
LED 1 — GPIO 18
</h4>


<div
    id="led1-indicator"
    class="led-indicator led-off">
</div>


<h5 class="text-center">
Estado:
<span
    id="led1-status"
    class="fw-bold">
Desconocido
</span>
</h5>


<div class="text-center mt-3">

<button
    id="btn-led1-on"
    class="btn btn-success me-2"
    disabled>

🟢 Encender

</button>


<button
    id="btn-led1-off"
    class="btn btn-danger"
    disabled>

🔴 Apagar

</button>

</div>

</div>


<!-- ============================================= -->
<!-- LED 2 -->
<!-- ============================================= -->

<div class="card bg-light p-3 mb-3">

<h4 class="text-center">
LED 2 — GPIO 19
</h4>


<div
    id="led2-indicator"
    class="led-indicator led-off">
</div>


<h5 class="text-center">
Estado:
<span
    id="led2-status"
    class="fw-bold">
Desconocido
</span>
</h5>


<div class="text-center mt-3">

<button
    id="btn-led2-on"
    class="btn btn-success me-2"
    disabled>

🟢 Encender

</button>


<button
    id="btn-led2-off"
    class="btn btn-danger"
    disabled>

🔴 Apagar

</button>

</div>

</div>


<!-- ============================================= -->
<!-- CONEXION -->
<!-- ============================================= -->

<div
    id="connection-status"
    class="alert alert-warning text-center">

Conectando...

</div>


</div>

</div>

</div>


<script>


// =====================================================
// WEBSOCKET
// =====================================================

const wsUrl =
    'wss://sistema-websocket.onrender.com';


let ws;


// =====================================================
// ELEMENTOS LED 1
// =====================================================

const led1Status =
    document.getElementById('led1-status');

const led1Indicator =
    document.getElementById('led1-indicator');

const btnLed1On =
    document.getElementById('btn-led1-on');

const btnLed1Off =
    document.getElementById('btn-led1-off');


// =====================================================
// ELEMENTOS LED 2
// =====================================================

const led2Status =
    document.getElementById('led2-status');

const led2Indicator =
    document.getElementById('led2-indicator');

const btnLed2On =
    document.getElementById('btn-led2-on');

const btnLed2Off =
    document.getElementById('btn-led2-off');


const connectionStatus =
    document.getElementById('connection-status');


// =====================================================
// DESHABILITAR
// =====================================================

function deshabilitarBotones()
{
    btnLed1On.disabled = true;
    btnLed1Off.disabled = true;

    btnLed2On.disabled = true;
    btnLed2Off.disabled = true;
}


// =====================================================
// LED 1
// =====================================================

function actualizarLed1(estado)
{

    led1Status.textContent =
        estado;


    if (estado === 'ON')
    {
        led1Status.className =
            'fw-bold text-success';

        led1Indicator.className =
            'led-indicator led-on';

        btnLed1On.disabled = true;
        btnLed1Off.disabled = false;
    }

    else
    {
        led1Status.className =
            'fw-bold text-danger';

        led1Indicator.className =
            'led-indicator led-off';

        btnLed1On.disabled = false;
        btnLed1Off.disabled = true;
    }
}


// =====================================================
// LED 2
// =====================================================

function actualizarLed2(estado)
{

    led2Status.textContent =
        estado;


    if (estado === 'ON')
    {
        led2Status.className =
            'fw-bold text-success';

        led2Indicator.className =
            'led-indicator led-on';

        btnLed2On.disabled = true;
        btnLed2Off.disabled = false;
    }

    else
    {
        led2Status.className =
            'fw-bold text-danger';

        led2Indicator.className =
            'led-indicator led-off';

        btnLed2On.disabled = false;
        btnLed2Off.disabled = true;
    }
}


// =====================================================
// CONECTAR
// =====================================================

function conectarWebSocket()
{

    console.log(
        '[WS] Conectando...'
    );


    deshabilitarBotones();


    connectionStatus.textContent =
        'Conectando al servidor...';

    connectionStatus.className =
        'alert alert-warning text-center';


    ws =
        new WebSocket(wsUrl);


    // =================================================
    // OPEN
    // =================================================

    ws.onopen = function()
    {

        console.log(
            '[WS] ✅ Conectado'
        );


        connectionStatus.textContent =
            '🟢 Conectado al servidor';

        connectionStatus.className =
            'alert alert-success text-center';
    };


    // =================================================
    // MESSAGE
    // =================================================

    ws.onmessage = function(event)
    {

        console.log(
            '[WS] RX:',
            event.data
        );


        try
        {

            const data =
                JSON.parse(event.data);


            if (data.type === 'status')
            {

                actualizarLed1(
                    data.led1
                );


                actualizarLed2(
                    data.led2
                );

            }

        }

        catch(error)
        {

            console.error(
                '[JSON] Error:',
                error
            );

        }
    };


    // =================================================
    // CLOSE
    // =================================================

    ws.onclose = function()
    {

        console.log(
            '[WS] ❌ Desconectado'
        );


        connectionStatus.textContent =
            '🔴 Desconectado. Reconectando...';

        connectionStatus.className =
            'alert alert-danger text-center';


        deshabilitarBotones();


        setTimeout(
            conectarWebSocket,
            5000
        );

    };


    // =================================================
    // ERROR
    // =================================================

    ws.onerror = function(error)
    {

        console.error(
            '[WS] Error:',
            error
        );

    };

}


// =====================================================
// LED 1 ON
// =====================================================

btnLed1On.addEventListener(
    'click',
    function()
    {

        if (
            ws &&
            ws.readyState === WebSocket.OPEN
        )
        {

            ws.send(
                JSON.stringify({
                    command: 'led1_on'
                })
            );

        }

    }
);


// =====================================================
// LED 1 OFF
// =====================================================

btnLed1Off.addEventListener(
    'click',
    function()
    {

        if (
            ws &&
            ws.readyState === WebSocket.OPEN
        )
        {

            ws.send(
                JSON.stringify({
                    command: 'led1_off'
                })
            );

        }

    }
);


// =====================================================
// LED 2 ON
// =====================================================

btnLed2On.addEventListener(
    'click',
    function()
    {

        if (
            ws &&
            ws.readyState === WebSocket.OPEN
        )
        {

            ws.send(
                JSON.stringify({
                    command: 'led2_on'
                })
            );

        }

    }
);


// =====================================================
// LED 2 OFF
// =====================================================

btnLed2Off.addEventListener(
    'click',
    function()
    {

        if (
            ws &&
            ws.readyState === WebSocket.OPEN
        )
        {

            ws.send(
                JSON.stringify({
                    command: 'led2_off'
                })
            );

        }

    }
);


// =====================================================
// INICIAR
// =====================================================

conectarWebSocket();

</script>

</body>

</html>
